version: '3.8'

# ============================================================
# ULC-ICAM Turnin System - Docker Compose
# Démarrage: docker-compose up -d
# ============================================================

services:

  # --- Application Flask principale ---
  web:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env                        # Charger toutes les variables depuis .env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./ulc_icam_data.json:/app/ulc_icam_data.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Worker Celery (tâches asynchrones IA / plagiat) ---
  celery:
    profiles: [relational-worker]
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./ulc_icam_data.json:/app/ulc_icam_data.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Celery Beat (tâches planifiées) ---
  celery-beat:
    profiles: [relational-worker]
    build: .
    command: celery -A celery_worker.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Redis (Cache + Queue) ---
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Flower (monitoring Celery, optionnel) ---
  flower:
    profiles: [worker-monitoring]
    build: .
    command: celery -A celery_worker.celery flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
