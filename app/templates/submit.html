{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-upload"></i> Soumettre un devoir</h4>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <h5>{{ assignment.title }}</h5>
                    <p class="text-muted">{{ assignment.course }}</p>
                    <p>{{ assignment.description }}</p>
                    <p class="text-danger">
                        <i class="fas fa-calendar"></i> 
                        Date limite : {{ assignment.due_date }}
                    </p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Sélectionner un fichier</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                        <div class="form-text">
                            Formats acceptés : PDF, DOC, DOCX, ZIP, RAR (Max 16MB)
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Retour
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload"></i> Soumettre
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
