name: Security and isolated migration tests
on:
  pull_request:
    branches: [ui, develop]
  push:
    branches: [codex/cognito-modernisation]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognito_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: cognito_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://cognito_test:isolated-test-only@localhost:5432/cognito_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: node tests/test_service_worker.cjs
