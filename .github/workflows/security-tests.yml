name: Security and isolated migration tests
on:
  pull_request:
    branches: [ui, develop]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognito_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: cognito_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://cognito_test:isolated-test-only@localhost:5432/cognito_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: node tests/test_service_worker.cjs
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag cognito-ci:latest .
      - name: Smoke test disposable image
        run: >-
          docker run --rm
          -e FLASK_SECRET_KEY=isolated-image-smoke-test-only
          -e FLASK_ENV=testing
          -e NOTIFICATIONS_ENABLED=false
          --entrypoint python cognito-ci:latest
          -c "from app import app; client = app.test_client(); assert client.get('/health').status_code == 200; assert client.get('/offline.html').status_code == 200"
      - name: Audit complete image dependencies
        run: >-
          docker run --rm --entrypoint sh cognito-ci:latest
          -c 'python -m pip install --quiet pip==26.2.1 pip-audit==2.10.1 && python -m pip_audit --progress-spinner off --timeout 30'
