{% extends "base_clean.html" %}

{% block title %}Ajouter Cours - ULC-ICAM{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="display-6 fw-bold mb-2">
                    <i class="fas fa-book-open me-3" style="color: #56ab2f;"></i>
                    Ajouter un cours
                </h1>
                <p class="text-muted">Créer un nouveau cours pour l'université</p>
            </div>
            
            <div class="card border-0 shadow-lg">
                <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%); color: white;">
                    <h4 class="mb-0 fw-bold">
                        <i class="fas fa-plus me-2"></i>Nouveau cours
                    </h4>
                </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="name" class="form-label">Nom du cours *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="code" class="form-label">Code du cours *</label>
                            <input type="text" class="form-control" id="code" name="code" placeholder="ex: INFO101" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="credits" class="form-label">Crédits *</label>
                            <input type="number" class="form-control" id="credits" name="credits" min="1" max="10" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="faculte" class="form-label">Faculté *</label>
                            <select class="form-select" id="faculte" name="faculte" required>
                                <option value="">Sélectionner</option>
                                {% for faculte in config.facultes %}
                                    <option value="{{ faculte }}">{{ faculte }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="departement" class="form-label">Département *</label>
                            <select class="form-select" id="departement" name="departement" required>
                                <option value="">Sélectionner</option>
                                {% for dept in config.departements %}
                                    <option value="{{ dept }}">{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Promotions concernées *</label>
                        <div class="form-text mb-2">Sélectionnez les niveaux pour ce cours</div>
                        <div class="row">
                            {% for promotion in config.promotions %}
                            <div class="col-md-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="promotions" 
                                           value="{{ promotion }}" id="promo_{{ promotion }}">
                                    <label class="form-check-label" for="promo_{{ promotion }}">
                                        {{ promotion }}
                                    </label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" 
                                  placeholder="Description du cours, objectifs, prérequis..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between pt-3">
                        <a href="{{ url_for('admin_courses_view') }}" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-arrow-left me-2"></i>Annuler
                        </a>
                        <button type="submit" class="btn btn-lg" style="background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%); border: none; color: white;">
                            <i class="fas fa-plus me-2"></i>Créer le cours
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
