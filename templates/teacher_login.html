{% extends "base.html" %}
{% block title %}Connexion Enseignant — ULC-ICAM{% endblock %}

{% block content %}
<div class="auth-logo">
  <img src="{{ url_for('static', filename='images/ulc-icam-logo.png') }}" alt="ULC-ICAM">
  <h1>ULC-ICAM Turnin</h1>
  <p>Portail enseignant</p>
</div>

<div class="text-center mb-4">
  <span class="role-badge teacher"><i class="fas fa-chalkboard-teacher"></i> Espace Enseignant</span>
</div>

<form method="POST">
  <div class="mb-3">
    <label for="username" class="form-label">Identifiant</label>
    <div class="input-group">
      <span class="input-group-text" style="background:#f8fafc;border-right:none;border-radius:10px 0 0 10px;">
        <i class="fas fa-user" style="color:#94a3b8;"></i>
      </span>
      <input type="text" class="form-control" id="username" name="username"
             placeholder="Ex: jb.mukendi" required
             style="border-left:none;border-radius:0 10px 10px 0;">
    </div>
  </div>

  <div class="mb-4">
    <label for="password" class="form-label">Mot de passe</label>
    <div class="input-group">
      <span class="input-group-text" style="background:#f8fafc;border-right:none;border-radius:10px 0 0 10px;">
        <i class="fas fa-lock" style="color:#94a3b8;"></i>
      </span>
      <input type="password" class="form-control" id="password" name="password"
             placeholder="Votre mot de passe" required
             style="border-left:none;border-radius:0 10px 10px 0;">
      <button class="btn" type="button" id="togglePwd"
              style="border:1.5px solid #e2e8f0;border-left:none;border-radius:0 10px 10px 0;background:#f8fafc;color:#94a3b8;">
        <i class="fas fa-eye" id="eyeIcon"></i>
      </button>
    </div>
  </div>

  <button type="submit" class="btn btn-gold btn-lg w-100">
    <i class="fas fa-sign-in-alt"></i> Se connecter
  </button>
</form>

<div class="text-center mt-4">
  <a href="{{ url_for('index') }}" style="font-size:.82rem;color:#94a3b8;text-decoration:none;">
    <i class="fas fa-arrow-left me-1"></i> Changer de portail
  </a>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('togglePwd').addEventListener('click', function() {
  const f = document.getElementById('password');
  const i = document.getElementById('eyeIcon');
  f.type = f.type === 'password' ? 'text' : 'password';
  i.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
});
</script>
{% endblock %}
