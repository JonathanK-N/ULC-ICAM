{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-book-open"></i> Mes Cours</h2>
</div>

<div class="row">
    {% for course in courses %}
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">{{ course.name }}</h5>
                    <span class="badge bg-primary">{{ course.code }}</span>
                </div>
                <a href="{{ url_for('student_course_detail', course_id=course.id) }}" class="btn btn-outline-primary btn-sm">
                    <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% if not courses %}
<div class="text-center">
    <i class="fas fa-book-open fa-3x text-muted mb-3"></i>
    <h4 class="text-muted">Aucun cours inscrit</h4>
</div>
{% endif %}

<div class="mt-4">
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Retour au tableau de bord
    </a>
</div>
{% endblock %}
