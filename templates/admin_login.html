{% extends "base_clean.html" %}

{% block title %}Connexion Admin - ULC-ICAM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-lg" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <img src="{{ url_for('static', filename='images/ulc-icam-logo.png') }}" alt="ULC-ICAM" height="60">
                    </div>
                    <div class="mb-3">
                        <i class="fas fa-user-shield" style="font-size: 3rem; opacity: 0.9;"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Portail Administrateur</h2>
                    <p class="mb-0 opacity-75">Accès sécurisé à l'administration</p>
                </div>
                
                <form method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-bold">Nom d'utilisateur</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-0">
                                <i class="fas fa-user text-muted"></i>
                            </span>
                            <input type="text" class="form-control border-0" id="username" name="username" 
                                   placeholder="Entrez votre nom d'utilisateur" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-0">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-0" id="password" name="password" 
                                   placeholder="Entrez votre mot de passe" required>
                            <button class="btn btn-outline-light border-0" type="button" id="togglePassword">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-light btn-lg fw-bold">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </div>
                </form>
                
                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="text-white text-decoration-none opacity-75">
                        <i class="fas fa-arrow-left me-2"></i>Changer de portail
                    </a>
                </div>
                
                <div class="mt-4 p-3 bg-white bg-opacity-10 rounded">
                    <small class="d-block text-center">
                        <i class="fas fa-info-circle me-1"></i>
                        Accès réservé aux administrateurs système
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('togglePassword').addEventListener('click', function() {
    const passwordField = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.className = 'fas fa-eye-slash';
    } else {
        passwordField.type = 'password';
        eyeIcon.className = 'fas fa-eye';
    }
});
</script>
{% endblock %}
